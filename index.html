<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — VenuSpa Pets</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  

<main class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="assets/logo.png" alt="Logo VenuSpa Pets">
    <h1>VenuSpa Pets</h1>
    <p class="tagline">Peluquería Canina</p>
    <p class="subtitle">Sistema de administración interno</p>

    <div class="login-error" id="loginError">Usuario o contraseña incorrectos.</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Ingresa tu usuario" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    <p class="login-hint">Acceso restringido al personal autorizado de VenuSpa Pets.</p>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/util.js"></script>
<script src="js/logic.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
